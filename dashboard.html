<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <script type="application/javascript" src="./main.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js" defer></script>
    <script src="https://unpkg.com/alpinejs" defer></script>


    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>

    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>
    <title>Login</title>
</head>
<body>
<div x-data="dashboard()" class="p-6 bg-gray-900 min-h-screen text-white">
    <h1 class="text-3xl font-bold mb-6">Dashboard</h1>
    <div class="max-w-7xl w-full mx-auto my-16">
        <div class="grid grid-cols-4 gap-6 ">
            <!-- Total Users -->
            <a href="users.html">
                <div
                        class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-pointer hover:shadow-lg transition"
                        title="Total Users"
                >
                    <h2 class="text-xl font-semibold mb-2">Total Users</h2>
                    <p class="text-4xl font-bold" x-text="response.totalUser"></p>
                </div>
            </a>

            <!-- Other cards disabled for now -->
            <div
                    class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-not-allowed opacity-60"
                    title="Total Live Users"
            >
                <h2 class="text-xl font-semibold mb-2">Total Live Users</h2>
                <p class="text-4xl font-bold" x-text="response.liveUser"></p>
            </div>

            <div
                    class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-not-allowed opacity-60"
                    title="Total Active Users"
            >
                <h2 class="text-xl font-semibold mb-2">Total Active Users</h2>
                <p class="text-4xl font-bold" x-text="response.activeUser">0</p>
            </div>

            <div
                    class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-not-allowed opacity-60"
                    title="Total Vip Users"
            >
                <h2 class="text-xl font-semibold mb-2">Total VIP Users</h2>
                <p class="text-4xl font-bold" x-text="response.vipUser">0</p>
            </div>

            <div
                    class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-not-allowed opacity-60"
                    title="Total Revenue"
            >
                <h2 class="text-xl font-semibold mb-2">Total Revenue</h2>
                <p class="text-4xl font-bold" x-text="response.vipUser">$0</p>
            </div>

            <div
                    class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-not-allowed opacity-60"
                    title="Total Posts"
            >
                <h2 class="text-xl font-semibold mb-2">Total Posts</h2>
                <p class="text-4xl font-bold" x-text="response.post">0</p>
            </div>

            <div
                    class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-not-allowed opacity-60"
                    title="Total Videos"
            >
                <h2 class="text-xl font-semibold mb-2">Total Videos</h2>
                <p class="text-4xl font-bold" x-text="response.video">0</p>
            </div>

            <div
                    class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-not-allowed opacity-60"
                    title="Not implemented yet"
            >
                <h2 class="text-xl font-semibold mb-2">Total Report Users</h2>
                <p class="text-4xl font-bold" x-text="response.report">0</p>
            </div>


            <!-- Announcements -->
            <a href="announcement.html">
                <div
                        class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-pointer hover:shadow-lg transition"
                        title="View Announcements"
                >
                    <h2 class="text-xl font-semibold mb-2">Announcements</h2>
                    <p class="text-4xl font-bold" x-text="response.announcementCount || 0"></p>
                </div>
            </a>

            <!-- Payment Requests -->
            <a href="payment_requests.html">
                <div
                        class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-pointer hover:shadow-lg transition"
                        title="View Payment Requests"
                >
                    <h2 class="text-xl font-semibold mb-2">Payment Requests</h2>
                    <p class="text-4xl font-bold" x-text="response.totalPaymentRequests || 0"></p>
                </div>
            </a>

            <a href="offer.html">
                <div
                        class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-pointer hover:shadow-lg transition"
                        title="View Offer"
                >
                    <h2 class="text-xl font-semibold mb-2">Add Offer</h2>
                    <p class="text-4xl font-bold" x-text="response.offerCount || 0"></p>
                </div>
            </a>

            <!-- New Card 4 -->


            <a href="gifts.html">
                <div
                        class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-pointer hover:shadow-lg transition"
                        title="Gifts"
                >
                    <h2 class="text-xl font-semibold mb-2">Add Gifts</h2>
                    <p class="text-4xl font-bold">Add Gifts</p>
                </div>

            </a>

            <!-- Top-ups -->
            <a href="top_ups.html">
                <div
                        class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-pointer hover:shadow-lg transition"
                        title="Top-ups"
                >
                    <h2 class="text-xl font-semibold mb-2">Top-ups</h2>
                    <p class="text-4xl font-bold" x-text="response.totalTopUps || 0"></p>
                </div>
            </a>


            <a href="collections.html">
                <div
                        class="bg-white text-gray-900 rounded-lg shadow p-6 cursor-pointer hover:shadow-lg transition"
                        title="Collections"
                >
                    <h2 class="text-xl font-semibold mb-2">Collections</h2>
                    <p class="text-4xl font-bold">Collections</p>
                </div>

            </a>


        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>

<script>
    function dashboard() {
        return {
            response: {
                activeUser: 0,
                liveUser: 0,
                post: 0,
                report: 0,
                revenue: {},
                totalUser: 0,
                video: 0,
                vipUser: 0,
                totalPaymentRequests: 0,
                totalTopUps: 0,
                announcementCount: 0,
                offerCount: 0,
            },
            init() {
                axios.get('http://localhost:7898/admin/dashboard', {
                    headers: {
                        Authorization: `Bearer ${getCookie('token')}`,
                    }
                }).then((response) => {
                    console.log(response.data);
                    this.response = response.data;
                }).catch((error) => {
                    console.log(error);
                }).finally(() => this.isWorking = false);
            }
        }
    }
</script>
</body>
</html>
