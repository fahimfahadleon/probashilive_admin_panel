<!DOCTYPE html>
<html lang="en" class="bg-gray-900 text-white min-h-screen">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gifts Management</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.2.4/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.0/build/svga.min.js"></script>
    <script src="./main.js"></script>
</head>

<body>
    <div class="p-6 w-full min-h-screen" x-data="giftPage()" x-init="fetchGifts()">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">Gifts</h1>
            <div>
                <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
                    @click="showGiftModal = true">Add Gift</button>
                <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 ml-4"
                    @click="showCategoryModal = true">Add Category</button>
            </div>
        </div>

        <template x-if="categories.length === 0">
            <p class="text-gray-400">No gifts/categories available.</p>
        </template>

        <template x-for="category in categories" :key="category.id" class="mb-8">
            <div>
                <h2 class="text-xl font-semibold mb-4" x-text="category.name"></h2>
                <div class="flex flex-wrap gap-4 justify-start">
                    <template x-for="gift in category.gifts" :key="gift.id">
                        <div class="bg-white text-gray-800 rounded shadow flex flex-col relative max-w-[90px] p-2"
                            x-init="$nextTick(() => initSVGAPlayer(`svga-${gift.id}`, `/api/${gift.imageUrl}`))">
                            <button @click="deleteGift(gift.id)"
                                class="absolute top-0 right-0 text-purple-600 hover:text-purple-800 text-sm font-bold leading-none m-1"
                                aria-label="Delete Gift" title="Delete" type="button">
                                ✖️
                            </button>

                            <p class="font-semibold text-start mb-1 truncate w-full text-xs" x-text="gift.name"></p>

                            <canvas :id="`svga-${gift.id}`" width="90" height="90" class="mb-1"></canvas>

                            <p class="text-xs text-gray-600 text-start" x-text="'$' + gift.price.toFixed(2)"></p>
                        </div>
                    </template>

                    <template x-if="category.gifts.length === 0">
                        <p class="text-gray-400 col-span-full">No gifts in this category.</p>
                    </template>
                </div>
            </div>
        </template>

        <!-- Add Gift Modal -->
        <div x-show="showGiftModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
            style="display: none;" @keydown.escape.window="showGiftModal = false">
            <div class="bg-white p-6 rounded-lg w-full max-w-md text-gray-800" @click.outside="showGiftModal = false">
                <h2 class="text-xl font-semibold mb-4">Add Gift</h2>
                <form @submit.prevent="createGift" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Name</label>
                        <input type="text" x-model="giftForm.name"
                            class="w-full border border-gray-300 rounded px-3 py-2" required />
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Price ($)</label>
                        <input type="number" x-model.number="giftForm.price" step="0.01" min="0"
                            class="w-full border border-gray-300 rounded px-3 py-2" required />
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Category</label>
                        <select x-model="giftForm.categoryId" class="w-full border border-gray-300 rounded px-3 py-2"
                            required>
                            <option value="" disabled>Select a category</option>
                            <template x-for="cat in categories" :key="cat.id">
                                <option :value="cat.id" x-text="cat.name"></option>
                            </template>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">SVGA File</label>
                        <input type="file" accept=".svga" @change="handleFileUpload" required />
                    </div>
                    <!-- Thumbnail preview -->
                    <div class="mb-4" x-show="thumbnailDataUrl">
                        <label class="block text-sm font-medium mb-1">Thumbnail Preview</label>
                        <img :src="thumbnailDataUrl" alt="Thumbnail Preview"
                            class="w-24 h-24 object-contain rounded border" />
                    </div>
                    <div class="flex justify-end">
                        <button type="button" class="text-gray-500 mr-4" @click="showGiftModal = false">Cancel</button>
                        <button type="submit"
                            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Add Category Modal -->
        <div x-show="showCategoryModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
            style="display: none;" @keydown.escape.window="showCategoryModal = false">
            <div class="bg-white p-6 rounded-lg w-full max-w-md text-gray-800"
                @click.outside="showCategoryModal = false">
                <h2 class="text-xl font-semibold mb-4">Add Category</h2>
                <form @submit.prevent="createCategory">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">Category Name</label>
                        <input type="text" x-model="categoryForm.name"
                            class="w-full border border-gray-300 rounded px-3 py-2" required />
                    </div>
                    <div class="flex justify-end">
                        <button type="button" class="text-gray-500 mr-4"
                            @click="showCategoryModal = false">Cancel</button>
                        <button type="submit"
                            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2500, timerProgressBar: true });

        function initSVGAPlayer(canvasId, svgaUrl) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const player = new SVGA.Player(canvas);
            const parser = new SVGA.Parser(canvas);
            parser.load(svgaUrl, (videoItem) => {
                player.setVideoItem(videoItem);
                player.startAnimation();
            });
        }

        function giftPage() {
            return {
                showGiftModal: false,
                showCategoryModal: false,
                categories: [],
                thumbnailDataUrl: null,  // New reactive property for thumbnail preview
                giftForm: { name: '', price: null, categoryId: '', file: null, thumbnailBlob: null },
                categoryForm: { name: '' },

                fetchGifts() {
                    axios.get('/api/gifts/by-category', {
                        headers: { Authorization: `Bearer ${getCookie('token')}` }
                    }).then(res => {
                        this.categories = res.data;
                    }).catch(() => {
                        Toast.fire({ icon: 'error', title: 'Failed to load gifts' });
                    });
                },

                deleteGift(id) {
                    Swal.fire({
                        title: 'Delete Gift?', text: 'This action cannot be undone.', icon: 'warning',
                        showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#aaa', confirmButtonText: 'Yes, delete it!'
                    }).then(result => {
                        if (!result.isConfirmed) return;
                        axios.delete(`/api/gifts/${id}`, {
                            headers: { Authorization: `Bearer ${getCookie('token')}` }
                        }).then(() => {
                            Toast.fire({ icon: 'success', title: 'Deleted successfully' });
                            this.fetchGifts();
                        }).catch(() => {
                            Toast.fire({ icon: 'error', title: 'Failed to delete gift' });
                        });
                    });
                },

                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file || !file.name.endsWith('.svga')) {
                        this.giftForm.file = null;
                        this.thumbnailDataUrl = null;
                        this.giftForm.thumbnailBlob = null;
                        Swal.fire('Error', 'Please select a valid SVGA file', 'error');
                        return;
                    }

                    this.giftForm.file = file;

                    const fileUrl = URL.createObjectURL(file);
                    const parser = new SVGA.Parser();

                    parser.load(fileUrl, (videoItem) => {
                        // Step 1: Create a full-size canvas to render the SVGA
                        const sourceCanvas = document.createElement('canvas');
                        sourceCanvas.width = videoItem.videoSize.width;
                        sourceCanvas.height = videoItem.videoSize.height;

                        const player = new SVGA.Player(sourceCanvas);
                        player.setVideoItem(videoItem);

                        const targetFrame = Math.min(10, videoItem.frames - 1);
                        player.stepToFrame(targetFrame, true);

                        // Step 2: Wait for render to finish
                        requestAnimationFrame(() => {
                            setTimeout(() => {
                                // Step 3: Create a 90x90 thumbnail canvas
                                const thumbCanvas = document.createElement('canvas');
                                const thumbSize = 90;
                                thumbCanvas.width = thumbSize;
                                thumbCanvas.height = thumbSize;

                                const ctx = thumbCanvas.getContext('2d');
                                ctx.fillStyle = 'white';
                                ctx.fillRect(0, 0, thumbSize, thumbSize); // background

                                // Step 4: Scale the full-size image into the thumbnail canvas
                                ctx.drawImage(
                                    sourceCanvas,
                                    0, 0, sourceCanvas.width, sourceCanvas.height,
                                    0, 0, thumbSize, thumbSize
                                );

                                // Step 5: Convert to blob and preview
                                thumbCanvas.toBlob((blob) => {
                                    this.giftForm.thumbnailBlob = blob;
                                }, 'image/png');

                                this.thumbnailDataUrl = thumbCanvas.toDataURL('image/png');
                            }, 50);
                        });
                    }, (error) => {
                        console.error('Failed to parse SVGA file', error);
                        Swal.fire('Error', 'Failed to parse SVGA file for thumbnail', 'error');
                        this.thumbnailDataUrl = null;
                        this.giftForm.thumbnailBlob = null;
                    });
                },



                createGift() {
                    if (!this.giftForm.file) {
                        Swal.fire('Error', 'Please select an SVGA file', 'error');
                        return;
                    }
                    if (!this.giftForm.thumbnailBlob) {
                        Swal.fire('Error', 'Thumbnail not generated yet, please wait', 'error');
                        return;
                    }

                    const formData = new FormData();
                    formData.append('file', this.giftForm.file);
                    formData.append('thumbnail', this.giftForm.thumbnailBlob, 'thumbnail.png');
                    formData.append('name', this.giftForm.name);
                    formData.append('price', this.giftForm.price);
                    formData.append('categoryId', this.giftForm.categoryId);

                    axios.post('/api/gifts/upload', formData, {
                        headers: { 'Content-Type': 'multipart/form-data', Authorization: `Bearer ${getCookie('token')}` }
                    }).then(() => {
                        Toast.fire({ icon: 'success', title: 'Gift added' });
                        this.showGiftModal = false;
                        this.giftForm = { name: '', price: null, categoryId: '', file: null, thumbnailBlob: null };
                        this.thumbnailDataUrl = null;
                        this.fetchGifts();
                    }).catch(err => {
                        Toast.fire({ icon: 'error', title: err.response?.data?.message || 'Failed to add gift' });
                    });
                },

                createCategory() {
                    if (!this.categoryForm.name.trim()) {
                        Swal.fire('Error', 'Category name cannot be empty', 'error');
                        return;
                    }
                    axios.post('/api/gifts/category', { name: this.categoryForm.name }, {
                        headers: { Authorization: `Bearer ${getCookie('token')}` }
                    }).then(() => {
                        Toast.fire({ icon: 'success', title: 'Category added' });
                        this.showCategoryModal = false;
                        this.categoryForm.name = '';
                        this.fetchGifts();
                    }).catch(() => {
                        Toast.fire({ icon: 'error', title: 'Failed to add category' });
                    });
                },

                onImgError(event) {
                    event.target.src = 'https://via.placeholder.com/64?text=No+Image';
                }
            }
        }
    </script>
</body>

</html>
