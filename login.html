<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./main.js"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-clifford: #da373d;
        }
    </style>
    <title>Login</title>
</head>

<body>
    <div
        class="h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-blue-600 to-slate-700 px-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 sm:p-10">
            <h1 class="text-3xl font-extrabold text-center text-slate-800 mb-6">Probashi Live</h1>
            <p class="text-center text-slate-600 mb-6">
                Enter your email and password to access the admin panel.
            </p>

            <form x-data="loadLogin()" class="space-y-5" @submit.prevent="onSubmit()">
                <div>
                    <label class="block mb-1 text-sm font-medium text-slate-700">Email</label>
                    <input type="email" x-model="email" placeholder="you@example.com"
                        class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-slate-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>

                <div>
                    <label class="block mb-1 text-sm font-medium text-slate-700">Password</label>
                    <input type="password" x-model="password" placeholder="••••••••"
                        class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-slate-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>

                <div x-show="errorMsg" x-text="errorMsg" class="text-red-600 text-sm font-medium"></div>

                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition-all duration-200 shadow-md">
                    <span x-show="!isWorking">Login</span>
                    <span x-show="isWorking">Logging in...</span>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>

    <script>
        function loadLogin() {
            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.onmouseenter = Swal.stopTimer;
                    toast.onmouseleave = Swal.resumeTimer;
                }
            });
            return {
                email: null,
                password: null,
                errorMsg: null,
                isWorking: false,
                onSubmit() {
                    if (this.email === null) {
                        this.errorMsg = 'Please enter a valid email';
                        return;
                    }
                    if (this.password === null) {
                        this.errorMsg = 'Please enter a valid password';
                        return;
                    }
                    this.isWorking = true;
                    axios.post('/api/auth/login', {
                        email: this.email,
                        password: this.password
                    }).then((response) => {
                        Toast.fire({
                            icon: "success",
                            title: "Signed in successfully"
                        });
                        console.log(response.data);
                        setCookie('token', response.data.access_token, 1);
                        window.location.href = '/dashboard.html';
                    }).catch((error) => {
                        this.errorMsg = 'Email or password invalid';
                        Toast.fire({
                            icon: "error",
                            title: "Sign-in failed"
                        });
                    }).finally(() => this.isWorking = false);
                }
            }
        }
    </script>
</body>

</html>
